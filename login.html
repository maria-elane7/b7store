<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B7Store</title>
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>
  <body>
    <section class="header-warning">
      <div class="mobile"><span>FRETE GRÁTIS</span> para todo o Nordeste!</div>
      <div class="desktop">
        <span>FRETE GRÁTIS</span> para todo o Nordeste nas compras acima de R$
        199,00. <span>APROVEITA!</span>
      </div>
    </section>
    <main>
      <section class="login-area">
        <div class="logo">
          <img src="assets/imagem/ui/logo-black.png" alt="" />
        </div>
        <div class="info-header">
          <div class="title">Faça o seu login</div>
          <div class="sub-title">Insira seus dados e faça login</div>
        </div>

        <form>
          <div class="input-area">
            <span>E-mail</span>
            <input type="email" class="input" placeholder="Digite seu E-mail"/>
          </div>
          <div class="input-area">
            <div class="info">
                <span>Senha</span>
                <span class="esqueceu-senha">Esqueceu sua senha?</span>
            </div>
            <input type="password" class="input" id="senha" placeholder="Digite sua Senha"/>
          </div>
          <div class="input-area">
            <input type="button" value="Entrar" class="button"/>
          </div>
        </form>

        <span class="tela-cadrastro">Não tem cadastro? <a href="">Cadastre-se aqui</a></span>
      </section>
    </main>
  </body>
</html>
